<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamro Kirana Store</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f4;
  color: #222;
}
header {
  background: #168447;
  color: white;
  padding: 22px 15px;
  text-align: center;
}
header h1 {
  margin: 0 0 8px;
}
header p {
  margin: 0;
}
.search {
  padding: 15px;
  text-align: center;
}
input {
  padding: 12px;
  width: 100%;
  max-width: 500px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}
h2 {
  text-align: center;
}
.products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 12px;
}
.product {
  background: white;
  border-radius: 12px;
  padding: 15px 8px;
  text-align: center;
  box-shadow: 0 2px 7px #0001;
}
.emoji {
  font-size: 42px;
}
.product h3 {
  margin: 8px 0;
}
.price {
  color: #168447;
  font-weight: bold;
}
button {
  border: none;
  border-radius: 7px;
  padding: 10px;
  cursor: pointer;
  font-size: 14px;
}
.add {
  background: #168447;
  color: white;
  width: 100%;
  margin-top: 8px;
}
.cart {
  background: white;
  padding: 18px;
  margin: 12px;
  border-radius: 12px;
}
.cart-item {
  padding: 9px 0;
  border-bottom: 1px solid #ddd;
}
.cart-item button {
  margin-left: 5px;
  background: #eee;
}
.order {
  background: #128c50;
  color: white;
  width: 100%;
  margin-top: 12px;
  font-size: 16px;
}
footer {
  background: #183b29;
  color: white;
  text-align: center;
  padding: 18px;
  margin-top: 20px;
}
@media (min-width: 650px) {
  .products {
    grid-template-columns: repeat(4, 1fr);
    max-width: 1000px;
    margin: auto;
  }
  .cart {
    max-width: 700px;
    margin: 20px auto;
  }
}
</style>
</head>

<body>

<header>
  <h1>🛒 Hamro Kirana Store</h1>
  <p>तपाईंको आफ्नै किराना पसल</p>
  <p>घरमै बसी सामान अर्डर गर्नुहोस्!</p>
</header>

<div class="search">
  <input
    type="text"
    id="search"
    placeholder="सामान खोज्नुहोस्..."
    oninput="showProducts()">
</div>

<h2>हाम्रा सामानहरू</h2>
<div class="products" id="products"></div>

<div class="cart">
  <h2>🛍️ तपाईंको Cart</h2>
  <div id="cartItems">अहिलेसम्म सामान छानिएको छैन।</div>
  <h3>जम्मा: रु. <span id="total">0</span></h3>
  <button class="order" onclick="placeOrder()">
    WhatsApp बाट अर्डर गर्नुहोस्
  </button>
</div>

<footer>
  <p>Hamro Kirana Store</p>
  <p>धन्यवाद! फेरि आउनुहोला ❤️</p>
</footer>

<script>
const items = [
  {id:1, name:"चामल (1 kg)", price:80, icon:"🍚"},
  {id:2, name:"दाल (1 kg)", price:160, icon:"🫘"},
  {id:3, name:"खाने तेल (1 L)", price:180, icon:"🫗"},
  {id:4, name:"चिनी (1 kg)", price:100, icon:"🍬"},
  {id:5, name:"नुन (1 kg)", price:25, icon:"🧂"},
  {id:6, name:"चाउचाउ", price:25, icon:"🍜"},
  {id:7, name:"बिस्कुट", price:30, icon:"🍪"},
  {id:8, name:"दूध (1 L)", price:100, icon:"🥛"},
  {id:9, name:"चिया पत्ती", price:80, icon:"🍵"},
  {id:10, name:"साबुन", price:40, icon:"🧼"},
  {id:11, name:"अण्डा (1 वटा)", price:20, icon:"🥚"},
  {id:12, name:"पिठो (1 kg)", price:70, icon:"🌾"}
];

let cart = [];

function showProducts() {
  const query = document.getElementById("search")
    .value.toLowerCase();

  const filtered = items.filter(item =>
    item.name.toLowerCase().includes(query)
  );

  document.getElementById("products").innerHTML =
    filtered.map(item => `
      <div class="product">
        <div class="emoji">${item.icon}</div>
        <h3>${item.name}</h3>
        <p class="price">रु. ${item.price}</p>
        <button class="add" onclick="addToCart(${item.id})">
          Cart मा राख्नुहोस्
        </button>
      </div>
    `).join("") || "<p>सामान भेटिएन।</p>";
}

function addToCart(id) {
  const found = cart.find(item => item.id === id);

  if (found) {
    found.qty++;
  } else {
    cart.push({...items.find(item => item.id === id), qty:1});
  }

  showCart();
}

function changeQty(id, amount) {
  const item = cart.find(item => item.id === id);
  if (!item) return;

  item.qty += amount;
  cart = cart.filter(item => item.qty > 0);
  showCart();
}

function showCart() {
  const container = document.getElementById("cartItems");

  if (cart.length === 0) {
    container.innerHTML = "अहिलेसम्म सामान छानिएको छैन।";
  } else {
    container.innerHTML = cart.map(item => `
      <div class="cart-item">
        ${item.name} × ${item.qty}
        = रु. ${item.price * item.qty}
        <button onclick="changeQty(${item.id},-1)">−</button>
        <button onclick="changeQty(${item.id},1)">+</button>
      </div>
    `).join("");
  }

  document.getElementById("total").textContent =
    cart.reduce((sum,item) =>
      sum + item.price * item.qty, 0);
}

function placeOrder() {
  if (cart.length === 0) {
    alert("पहिला सामान छान्नुहोस्!");
    return;
  }

  // यहाँ आफ्नो WhatsApp नम्बर राख्नुहोस्।
  // उदाहरण: 97798XXXXXXXX
  const phone = "97798XXXXXXXX";

  const order = cart.map(item =>
    `${item.name} x ${item.qty} = Rs. ${item.price * item.qty}`
  ).join("\n");

  const message =
    "Namaste! Hamro Kirana Store ma mero order:\n\n" +
    order +
    "\n\nTotal: Rs. " +
    cart.reduce((sum,item) =>
      sum + item.price * item.qty, 0);

  window.open(
    "https://wa.me/" + phone +
    "?text=" + encodeURIComponent(message),
    "_blank"
  );
}

showProducts();
showCart();
</script>

</body>
</html>
